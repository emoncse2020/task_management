
{% extends "users/admin/dashboard.html" %}

{% block content %}


    <div class='w-1/2 mx-auto my-8'>
        <ul>
            {% for message in messages %}
                <li class="bg-green-500 text-white px-2 py-1">{{message}}</li>
            {% endfor %}
        </ul>
        <form action="" method="POST">
            {% csrf_token %}
            {{form}}
            <button type="submit" class="px-2 py1 bg-blue-500 ">Assign Role</button>
        </form>

    </div>
{% endblock content %}
